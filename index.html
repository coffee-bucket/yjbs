<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>양주백석고 입시결과 검색도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0d1b2a;
    --navy-mid: #1b2d42;
    --blue: #1a6db5;
    --blue-light: #3a8fd4;
    --accent: #e8a020;
    --pass: #1a7a4a;
    --pass-bg: #e6f4ed;
    --fail: #b02020;
    --fail-bg: #fceaea;
    --extra: #5a3ea0;
    --extra-bg: #f0ebfa;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #dde3ec;
    --text: #1a2535;
    --muted: #6b7a8d;
    --font: 'Noto Sans KR', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* HEADER */
  .header {
    background: var(--navy);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header-badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .header-title {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .header-sub {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    margin-left: auto;
  }

  /* MAIN */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--navy); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.green { color: var(--pass); }
  .stat-value.amber { color: var(--accent); }

  /* FILTER PANEL */
  .filter-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: 1.4fr 1.4fr 0.9fr 0.9fr 0.9fr 0.9fr 0.9fr auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 1000px) {
    .filter-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .filter-grid { grid-template-columns: 1fr 1fr; }
  }
  .filter-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
  }
  .filter-group input,
  .filter-group select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-group input:focus,
  .filter-group select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(26,109,181,0.1);
  }
  .btn-reset {
    padding: 8px 16px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-reset:hover { background: var(--blue); }

  /* RANGE FILTER */
  .range-row {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    align-items: center;
    flex-wrap: nowrap;
  }
  .range-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    flex: 1;
  }
  .range-group input[type=number] {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: var(--mono);
    text-align: center;
  }
  .range-group input[type=number]:focus {
    border-color: var(--blue);
    outline: none;
  }

  /* RESULT TABLE */
  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .result-count {
    font-size: 13px;
    color: var(--muted);
  }
  .result-count strong { color: var(--text); font-family: var(--mono); }

  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead tr {
    background: var(--navy);
    color: #fff;
  }
  thead th {
    padding: 11px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
  }
  thead th:hover { background: var(--navy-mid); }
  thead th.sorted { color: var(--accent); }
  .sort-arrow { margin-left: 4px; opacity: 0.6; font-size: 10px; }

  tbody tr {
    border-bottom: 1px solid #edf0f5;
    transition: background 0.1s;
  }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr:last-child { border-bottom: none; }
  tbody td {
    padding: 10px 14px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .year-badge {
    display: inline-block;
    background: #e8eef6;
    color: var(--navy);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .status-pass { background: var(--pass-bg); color: var(--pass); }
  .status-fail { background: var(--fail-bg); color: var(--fail); }
  .status-extra { background: var(--extra-bg); color: var(--extra); }

  .grade-cell {
    font-family: var(--mono);
    font-weight: 500;
  }

  .univ-name { font-weight: 500; color: var(--navy); }
  .dept-name { color: var(--muted); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 16px;
  }
  .page-btn {
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1.5px solid var(--border);
    background: var(--card);
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--mono);
    color: var(--text);
    transition: all 0.1s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .page-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .footer-note {
    margin-top: 24px;
    padding: 12px 16px;
    background: #fffbf0;
    border: 1px solid #f0d080;
    border-radius: 8px;
    font-size: 12px;
    color: #7a6010;
    line-height: 1.6;
  }
</style>
</head>

function MultiSelect({ options, selected, onChange, labelKey, displayFn, placeholder, suffix }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  function toggle(v) {
    onChange(selected.includes(v) ? selected.filter(x=>x!==v) : [...selected, v]);
  }
  const sfx = suffix || '';
  const label = selected.length === 0
    ? '전체'
    : selected.length <= 2
      ? selected.map(v => displayFn ? displayFn(v) : v).join(', ')
      : `${displayFn ? displayFn(selected[0]) : selected[0]} 외 ${selected.length-1}${sfx}`;
  return (
    <div ref={ref} style={{position:'relative'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%', padding:'8px 10px', border:'1.5px solid',
        borderColor: open ? 'var(--blue)' : 'var(--border)',
        borderRadius:6, background:'#fff', font:'inherit', fontSize:13,
        color: selected.length ? 'var(--text)' : '#9aa5b4',
        textAlign:'left', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center',
        boxShadow: open ? '0 0 0 3px rgba(26,109,181,0.1)' : 'none',
      }}>
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</span>
        <span style={{fontSize:10,color:'var(--muted)',marginLeft:4,flexShrink:0}}>{open?'▲':'▼'}</span>
      </button>
      {open && (
        <div style={{
          position:'absolute', top:'calc(100% + 4px)', left:0, right:0,
          background:'#fff', border:'1.5px solid var(--border)', borderRadius:8,
          boxShadow:'0 4px 16px rgba(0,0,0,0.12)', zIndex:300, padding:'6px 0',
          minWidth: 120, maxHeight:260, overflowY:'auto'
        }}>
          <div onClick={()=>onChange([])} style={{
            padding:'7px 14px', cursor:'pointer', fontSize:12, fontWeight:600,
            color: selected.length===0 ? 'var(--blue)' : 'var(--muted)',
            borderBottom:'1px solid #eee', marginBottom:4
          }}>전체 (선택 해제)</div>
          {options.map(v => {
            const sel = selected.includes(v);
            return (
              <div key={v} onClick={()=>toggle(v)} style={{
                padding:'7px 14px', cursor:'pointer', fontSize:13,
                display:'flex', alignItems:'center', gap:8,
                background: sel ? '#f0f5ff' : 'transparent',
                color: sel ? 'var(--blue)' : 'var(--text)',
              }}>
                <span style={{
                  width:14, height:14, border:'1.5px solid', flexShrink:0,
                  borderColor: sel ? 'var(--blue)' : 'var(--border)',
                  borderRadius:3, display:'flex', alignItems:'center', justifyContent:'center',
                  background: sel ? 'var(--blue)' : '#fff',
                }}>
                  {sel && <span style={{color:'#fff',fontSize:9,fontWeight:700}}>✓</span>}
                </span>
                {displayFn ? displayFn(v) : v}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [searchUniv, setSearchUniv] = React.useState('');
  const [searchDept, setSearchDept] = React.useState('');
  const [selYears,   setSelYears]   = React.useState([]);
  const [selTypes,   setSelTypes]   = React.useState([]);
  const [selStatus,  setSelStatus]  = React.useState([]);
  const [selRegions, setSelRegions] = React.useState([]);
  const [selKyeyul,  setSelKyeyul]  = React.useState([]);
  const [gradeMode,  setGradeMode]  = React.useState('9등급'); // '9등급' | '5등급'
  const [gradeMin,   setGradeMin]   = React.useState('');
  const [gradeMax,   setGradeMax]   = React.useState('');
  const [sortCol,    setSortCol]    = React.useState('연도');
  const [sortDir,    setSortDir]    = React.useState('desc');
  const [page,       setPage]       = React.useState(1);

  const years    = [...new Set(RAW_DATA.map(d => d.연도))].sort((a,b)=>b-a);
  const 계열목록  = [...new Set(RAW_DATA.map(d => d.계열))].filter(Boolean).sort();
  const regions = [...new Set(RAW_DATA.map(d => d.지역))].filter(Boolean).sort();
  const gradeField = gradeMode === '9등급' ? '9등급' : '5등급';

  const filtered = React.useMemo(() => {
    return RAW_DATA.filter(d => {
      if (selYears.length   > 0 && !selYears.includes(d.연도))    return false;
      if (selTypes.length   > 0 && !selTypes.includes(d.전형유형)) return false;
      if (selStatus.length  > 0 && !selStatus.includes(d.합격여부)) return false;
      if (selRegions.length > 0 && !selRegions.includes(d.지역))   return false;
      if (selKyeyul.length  > 0 && !selKyeyul.includes(d.계열))    return false;
      const g = d[gradeField];
      if (gradeMin !== '' && (g == null || g < Number(gradeMin))) return false;
      if (gradeMax !== '' && (g == null || g > Number(gradeMax))) return false;
      if (searchUniv && !d.대학명.toLowerCase().includes(searchUniv.trim().toLowerCase())) return false;
      if (searchDept && !d.모집단위.toLowerCase().includes(searchDept.trim().toLowerCase())) return false;
      return true;
    }).sort((a,b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (av == null) av = sortDir === 'asc' ? Infinity : -Infinity;
      if (bv == null) bv = sortDir === 'asc' ? Infinity : -Infinity;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv,'ko') : bv.localeCompare(av,'ko');
      return sortDir === 'asc' ? av - bv : bv - av;
    });
  }, [searchUniv, searchDept, selYears, selTypes, selStatus, selRegions, selKyeyul, gradeMode, gradeMin, gradeMax, sortCol, sortDir]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageData   = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const totalPass  = filtered.filter(d => d.합격여부 === '합격' || d.합격여부 === '충원합격').length;

  function handleSort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
    setPage(1);
  }

  function reset() {
    setSearchUniv(''); setSearchDept('');
    setSelYears([]); setSelTypes([]); setSelStatus([]); setSelRegions([]); setSelKyeyul([]);
    setGradeMin(''); setGradeMax(''); setPage(1);
  }

  function cf(fn) { fn(); setPage(1); }

  function SortTh({ col, label }) {
    const active = sortCol === col;
    return (
      <th className={active ? 'sorted' : ''} onClick={() => handleSort(col)}>
        {label}<span className="sort-arrow">{active ? (sortDir==='asc'?'↑':'↓') : '↕'}</span>
      </th>
    );
  }

  function StatusBadge({ v }) {
    const cls = v==='합격' ? 'status-pass' : v==='충원합격' ? 'status-extra' : 'status-fail';
    const icon = v==='합격' ? '✓' : v==='충원합격' ? '△' : '✗';
    return <span className={`status-badge ${cls}`}>{icon} {v}</span>;
  }

  const typeDisplayFn = v => v.includes('종합') ? '종합' : v.includes('교과') ? '교과' : v.includes('논술') ? '논술' : '실기';

  return (
    <>
      <header className="header">
        <span className="header-title" style={{flex:1,textAlign:'center',fontSize:16,letterSpacing:'-0.02em'}}>2023~2026 양주백석고 입시결과 검색도구</span>
        <span style={{fontSize:11,color:'rgba(255,255,255,0.45)',whiteSpace:'nowrap'}}>3학년부 박정수 제작</span>
      </header>

      <div className="container">
        {/* STATS */}
        <div className="stats-row">
          <div className="stat-card">
            <div className="stat-label">전체 데이터</div>
            <div className="stat-value blue">{RAW_DATA.length.toLocaleString()}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">검색 결과</div>
            <div className="stat-value">{filtered.length.toLocaleString()}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">합격 (충원포함)</div>
            <div className="stat-value green">{totalPass.toLocaleString()}</div>
          </div>
        </div>

        {/* FILTER */}
        <div className="filter-panel">
          <div className="filter-grid">
            <div className="filter-group">
              <label>연도</label>
              <MultiSelect
                options={years} selected={selYears} suffix="개"
                onChange={v => cf(()=>setSelYears(v))} />
            </div>
            <div className="filter-group">
              <label>학교명</label>
              <input type="text" placeholder="예) 경희대, 한양대..."
                value={searchUniv} onChange={e => cf(()=>setSearchUniv(e.target.value))} />
            </div>
            <div className="filter-group">
              <label>학과 / 모집단위</label>
              <input type="text" placeholder="예) 소프트웨어, 간호..."
                value={searchDept} onChange={e => cf(()=>setSearchDept(e.target.value))} />
            </div>
            <div className="filter-group">
              <label>지역</label>
              <MultiSelect
                options={regions} selected={selRegions} suffix="곳"
                onChange={r => cf(()=>setSelRegions(r))} />
            </div>
            <div className="filter-group">
              <label>계열</label>
              <MultiSelect
                options={계열목록} selected={selKyeyul} suffix="개"
                onChange={v => cf(()=>setSelKyeyul(v))} />
            </div>
            <div className="filter-group">
              <label>전형유형</label>
              <MultiSelect
                options={['학생부위주(교과)','학생부위주(종합)','논술위주','실기/실적위주']}
                selected={selTypes} suffix="개"
                displayFn={typeDisplayFn}
                onChange={v => cf(()=>setSelTypes(v))} />
            </div>
            <div className="filter-group">
              <label>합격여부</label>
              <MultiSelect
                options={['합격','충원합격','불합격','미확인']}
                selected={selStatus} suffix="개"
                onChange={v => cf(()=>setSelStatus(v))} />
            </div>
            <div className="filter-group">
              <label>&nbsp;</label>
              <button className="btn-reset" onClick={reset}>초기화</button>
            </div>
          </div>

          {/* 등급 범위 */}
          <div className="range-row" style={{width:"77%"}}>
            {/* 9등급 / 5등급 탭 */}
            <div style={{display:'flex',borderRadius:6,overflow:'hidden',border:'1.5px solid var(--border)',flexShrink:0}}>
              {['9등급','5등급'].map(m => (
                <button key={m} onClick={()=>{setGradeMode(m);setGradeMin('');setGradeMax('');setPage(1);}} style={{
                  padding:'5px 12px', border:'none', cursor:'pointer', fontSize:12, fontWeight:600,
                  background: gradeMode===m ? 'var(--blue)' : '#fff',
                  color: gradeMode===m ? '#fff' : 'var(--muted)',
                  transition:'all 0.15s',
                }}>{m}</button>
              ))}
            </div>
            <span style={{fontSize:11,fontWeight:600,color:'var(--muted)',letterSpacing:'0.04em'}}>범위</span>
            <div className="range-group">
              <input type="number" min="1" max={gradeMode==='9등급'?9:5} step="0.01"
                placeholder="최소" value={gradeMin}
                onChange={e=>cf(()=>setGradeMin(e.target.value))} />
              <span>~</span>
              <input type="number" min="1" max={gradeMode==='9등급'?9:5} step="0.01"
                placeholder="최대" value={gradeMax}
                onChange={e=>cf(()=>setGradeMax(e.target.value))} />

            </div>
          </div>
        </div>

        {/* TABLE */}
        <div className="result-header">
          <div className="result-count">
            <strong>{filtered.length.toLocaleString()}</strong>건 검색됨
            {filtered.length !== RAW_DATA.length && ` (전체 ${RAW_DATA.length.toLocaleString()}건 중)`}
          </div>
        </div>

        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <SortTh col="연도" label="연도" />
                <SortTh col="지역" label="지역" />
                <SortTh col="대학명" label="대학명" />
                <SortTh col="세부유형" label="세부전형" />
                <SortTh col="전형유형" label="유형" />
                <SortTh col="계열" label="계열" />
                <SortTh col="모집단위" label="모집단위" />
                <SortTh col="합격여부" label="합격여부" />
                <SortTh col="9등급" label="9등급" />
                <SortTh col="5등급" label="5등급" />
              </tr>
            </thead>
            <tbody>
              {pageData.length === 0 ? (
                <tr><td colSpan={10}>
                  <div className="empty-state">
                    <div className="icon">🔍</div>
                    <p>검색 결과가 없습니다. 조건을 변경해 보세요.</p>
                  </div>
                </td></tr>
              ) : pageData.map((d, i) => (
                <tr key={i}>
                  <td><span className="year-badge">{d.연도}</span></td>
                  <td style={{color:'var(--muted)',fontSize:12}}>{d.지역}</td>
                  <td className="univ-name">{d.대학명}</td>
                  <td style={{fontSize:12,color:'var(--muted)',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={d.세부유형}>{d.세부유형}</td>
                  <td>
                    <span style={{
                      fontSize:11, fontWeight:600, padding:'2px 7px', borderRadius:4,
                      background: d.전형유형.includes('종합')?'#e8eef6':'#e8f4ee',
                      color: d.전형유형.includes('종합')?'#1a3a6b':'#1a5a30'
                    }}>{d.전형유형.includes('종합')?'종합':'교과'}</span>
                  </td>
                  <td style={{fontSize:12,color:'var(--muted)'}}>{d.계열}</td>
                  <td className="dept-name">{d.모집단위}</td>
                  <td><StatusBadge v={d.합격여부} /></td>
                  <td className="grade-cell">{d['9등급'] != null ? d['9등급'].toFixed(2) : '-'}</td>
                  <td className="grade-cell" style={{color:'var(--muted)'}}>{d['5등급'] != null ? d['5등급'].toFixed(2) : '-'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* PAGINATION */}
        {totalPages > 1 && (
          <div className="pagination">
            <button className="page-btn" onClick={()=>setPage(1)} disabled={page===1}>«</button>
            <button className="page-btn" onClick={()=>setPage(p=>p-1)} disabled={page===1}>‹</button>
            {Array.from({length: totalPages}, (_,i)=>i+1)
              .filter(p => p===1 || p===totalPages || Math.abs(p-page)<=2)
              .reduce((acc,p,idx,arr)=>{
                if(idx>0 && p-arr[idx-1]>1) acc.push('...');
                acc.push(p); return acc;
              },[])
              .map((p,i) => typeof p==='string'
                ? <span key={i} style={{padding:'0 4px',color:'var(--muted)'}}>…</span>
                : <button key={i} className={`page-btn${page===p?' active':''}`} onClick={()=>setPage(p)}>{p}</button>
              )}
            <button className="page-btn" onClick={()=>setPage(p=>p+1)} disabled={page===totalPages}>›</button>
            <button className="page-btn" onClick={()=>setPage(totalPages)} disabled={page===totalPages}>»</button>
          </div>
        )}

        <div className="footer-note">
          ⚠️ <strong>교사 전용 내부 자료</strong>입니다. 외부 공유 금지 · 학생 상담 참고용으로만 활용하세요.<br/>
          📋 현재 데이터: 양주백석고 2023–2026 수시 전체 결과 3,719건 (합격·충원합격·불합격 포함). 대학명에 마우스를 올리면 세부전형명 확인 가능.
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
